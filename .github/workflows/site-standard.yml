name: site-standard-guards

on:
  push:
    branches: [main, codex/reports-hero-enhancement]
  pull_request:

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://leverageai.network
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Site-standard guards
        run: pnpm guard:site-standard
